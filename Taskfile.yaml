# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# limes — the module's gates.
#
#   task --list
#   task verify-all      # before pushing; CI runs the same task
#
# The library is the module at the root, so the shared library's Go verbs are
# flattened in: `task test`, not `task go:test`. The redisreplay, otelmetric,
# exchange and biscuit modules have gates of their own, verify:redisreplay,
# verify:otelmetric, verify:exchange and verify:biscuit.

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v14.1.0'
  # The developer tools' own module; see its go.mod.
  TOOLS_MODFILE: tools/go.mod
  # golangci-lint's module, apart from TOOLS_MODFILE; see its go.mod.
  GOLANGCI_LINT_MODFILE: tools/golangci-lint/go.mod
  # The Redis replay cache, a module of its own so the root never resolves a
  # Redis client.
  REDISREPLAY_DIR: redisreplay
  OTELMETRIC_DIR: otelmetric
  # The OAuth token exchange, a module of its own so the root never resolves
  # a JOSE library.
  EXCHANGE_DIR: exchange
  # The Biscuit form, a module of its own so the root never resolves
  # biscuit-go or protobuf.
  BISCUIT_DIR: biscuit
  # The reference PostgreSQL store, a module of its own: `./...` from the
  # root does not reach it.
  PGSTORE_DIR: pgstore
  # The PostgreSQL container pgstore's tests run against, a module of its own
  # so that testcontainers stays out of pgstore's go.mod (pgstore/internal/pgtest).
  PGCONTAINER_DIR: pgstore/internal/pgcontainer
  # The runnable examples, a module of their own since one of them uses
  # pgstore and its driver.
  EXAMPLES_DIR: examples
  # The TypeScript the workflows run, a Node package of its own.
  CI_DIR: .github/ci
  # LIMES_MODULE is the root module's path, which every nested module
  # replaces with this checkout.
  LIMES_MODULE: github.com/oleg-tkachuk/limes

includes:
  go:
    taskfile: '{{printf .TASKLIB "go"}}'
    # The sha256 of this Taskfile at TASKLIB's ref. A tag can be moved, and
    # the gate runs it with --yes, so a moved tag fails rather than runs.
    # Task does not template this field; bump it with the ref, from the
    # checksum Task reports it got.
    checksum: 9e9da097a7bcb0992d9705975c3405850ee8c82f34180589a746bdaf913cdb33
    dir: .
    flatten: true
    # Its vuln and lint run a govulncheck and a golangci-lint from PATH; the
    # ones below run the versions tools/ pins. Its fmt also runs a goimports
    # from PATH, which reads a package-level name of another test file as a
    # package and imports one for it; the fmt below is gofmt alone. Its build
    # builds the binaries of ./cmd/..., and this module has none.
    excludes: [vuln, lint, fmt, build]
    # GO_TEST_FLAGS spelled out, so a bump of the library cannot drop -race.
    vars: { PROJECT_NAME: limes, GO_TEST_FLAGS: -race -short }

tasks:
  default:
    cmds:
      - task --list

  deps:update:all:
    desc: "deps:update for the root, then the same in every nested module, tools and examples among them — each one's direct requirements to the latest minor/patch, tidied and built (.github/ci/update-modules.ts)"
    cmds:
      - task: deps:update
      - node .github/ci/update-modules.ts

  verify-all:
    desc: "gofmt + go mod tidy/verify + golangci-lint + a 32-bit build + the unit suite + govulncheck + actionlint + the CI scripts + the release rules and notes + the redisreplay, otelmetric, exchange and biscuit modules + pgstore's static checks + the examples that need no database — what CI runs, but test:pgstore and test:examples:pgstore"
    cmds:
      - task: verify:gate
      - task: lint:all

  verify:gate:
    desc: "verify-all but golangci-lint, which CI runs as a job of its own (lint:all)"
    cmds:
      - task: fmt:check
      - task: verify:tidy
      - task: verify:32-bit
      - task: test
      - task: vuln
      - task: verify:workflows
      - task: verify:ci
      - task: verify:release-rules
      - task: verify:redisreplay
      - task: verify:otelmetric
      - task: verify:exchange
      - task: verify:biscuit
      - task: verify:pgstore
      - task: verify:examples

  verify:redisreplay:
    desc: "The redisreplay module's own gate: go mod tidy/verify, go vet, the unit suite and govulncheck — ./... at the root does not reach a nested module"
    dir: '{{.REDISREPLAY_DIR}}'
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go vet ./...
      - go test -race -short ./...
      - go tool -modfile=../{{.TOOLS_MODFILE}} govulncheck ./...

  verify:otelmetric:
    desc: "The otelmetric module's own gate: go mod tidy/verify, go vet, the unit suite and govulncheck — ./... at the root does not reach a nested module"
    dir: '{{.OTELMETRIC_DIR}}'
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go vet ./...
      - go test -race -short ./...
      - go tool -modfile=../{{.TOOLS_MODFILE}} govulncheck ./...

  verify:exchange:
    desc: "The exchange module's own gate: go mod tidy/verify, go vet, the unit suite and govulncheck — ./... at the root does not reach a nested module"
    dir: '{{.EXCHANGE_DIR}}'
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go vet ./...
      - go test -race -short ./...
      - go tool -modfile=../{{.TOOLS_MODFILE}} govulncheck ./...

  verify:biscuit:
    desc: "The biscuit module's own gate: go mod tidy/verify, go vet, the unit suite and govulncheck — ./... at the root does not reach a nested module"
    dir: '{{.BISCUIT_DIR}}'
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go vet ./...
      - go test -race -short ./...
      - go tool -modfile=../{{.TOOLS_MODFILE}} govulncheck ./...

  verify:pgstore:
    desc: "pgstore, its own module, and the container module its tests run: go mod tidy/verify, go vet and govulncheck — what needs no database; test:pgstore runs its tests"
    dir: '{{.PGSTORE_DIR}}'
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go vet ./...
      - go tool -modfile=../{{.TOOLS_MODFILE}} govulncheck ./...
      - cmd: go mod tidy -diff
        dir: '{{.PGCONTAINER_DIR}}'
      - cmd: go mod verify
        dir: '{{.PGCONTAINER_DIR}}'
      - cmd: go vet ./...
        dir: '{{.PGCONTAINER_DIR}}'
      - cmd: go tool -modfile={{.ROOT_DIR}}/{{.TOOLS_MODFILE}} govulncheck ./...
        dir: '{{.PGCONTAINER_DIR}}'

  verify:examples:
    desc: "The examples module: go mod tidy/verify, go vet, its tests, and every example that needs no database, run to the end — each exits non-zero on a step that does not do what it says"
    dir: '{{.EXAMPLES_DIR}}'
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go vet ./...
      - go test -race -short ./...
      - go run ./quickstart
      - go run ./issue-verify
      - go run ./delegation
      - go run ./metering
      - go run ./mcp-exchange
      # Node's jose against limes tokens: internal/interop/node_fixture_test.go
      # writes the fixture, and the Node test reads it.
      - node ../{{.CI_DIR}}/install.ts internal/interop/testdata/node
      - node --test internal/interop/testdata/node/interop.test.ts

  test:examples:pgstore:
    desc: "Run the pgstore example to the end against PostgreSQL in a container — needs a running Docker"
    dir: '{{.EXAMPLES_DIR}}'
    cmds:
      - go run ./pgstore

  test:pgstore:
    desc: "pgstore's tests, the contract suites among them, against PostgreSQL in a container — needs a running Docker"
    dir: '{{.PGSTORE_DIR}}'
    cmds:
      - go test -race -count=1 ./...

  test:pinned:
    desc: "A nested module's tests against the limes its go.mod requires, as a consumer's build resolves it, not the limes of this commit — MODULE is pgstore, redisreplay, otelmetric, exchange or biscuit; needs the module proxy, and Docker for pgstore"
    requires:
      vars: [MODULE]
    dir: '{{.MODULE}}'
    vars:
      # A copy of go.mod without the replace, in a scratch directory: the
      # tracked go.mod and go.sum stay as they are.
      PINNED_DIR:
        sh: mktemp -d
    cmds:
      - defer: rm -rf '{{.PINNED_DIR}}'
      - cp go.mod go.sum '{{.PINNED_DIR}}/'
      - go mod edit -dropreplace={{.LIMES_MODULE}} '{{.PINNED_DIR}}/go.mod'
      - go test -modfile='{{.PINNED_DIR}}/go.mod' -mod=mod -race -count=1 ./...

  test:pgstore:soak:
    desc: "pgstore under concurrent workers for SOAK_DURATION (default 20s), then every counter checked against what they did — needs a running Docker"
    dir: '{{.PGSTORE_DIR}}'
    vars:
      SOAK_DURATION: '{{.SOAK_DURATION | default "20s"}}'
    env:
      LIMES_SOAK_DURATION: '{{.SOAK_DURATION}}'
    cmds:
      # -timeout bounds the soak past any duration the weekly run asks for.
      - go test -tags soak -count=1 -run '^TestSoak$' -timeout 3h -v .

  bench:pgstore:
    desc: "pgstore's benchmarks on this commit beside the newest pgstore release, compared by benchstat — needs a running Docker and the release's tag"
    cmds:
      - node .github/ci/bench.ts pgstore

  bench:pgstore:scale:
    desc: "pgstore's Charge, Bump and IsRevoked at chain depths 1 to 64 and with 0, 1 and 2 ms added to every round trip to PostgreSQL (bench_scale_test.go) — needs a running Docker; takes minutes"
    dir: '{{.PGSTORE_DIR}}'
    env:
      LIMES_BENCH_SCALE: "1"
    cmds:
      - go test -run '^$' -bench 'ChainDepth|RoundTrip' -benchtime 2s -timeout 30m .

  bench:limes:
    desc: "limes's benchmarks on this commit beside the newest limes release, compared by benchstat — needs the release's tag"
    cmds:
      - node .github/ci/bench.ts limes

  bench:otelmetric:
    desc: "otelmetric's benchmarks on this commit beside the newest otelmetric release, compared by benchstat — needs the release's tag"
    cmds:
      - node .github/ci/bench.ts otelmetric

  test:redisreplay:
    desc: "redisreplay's contract against a real Redis at LIMES_REDIS_ADDR (host:port) — miniredis runs another Lua, so this is the check of the script itself"
    dir: '{{.REDISREPLAY_DIR}}'
    preconditions:
      - sh: test -n "$LIMES_REDIS_ADDR"
        msg: "LIMES_REDIS_ADDR is not set — start a Redis and name it as host:port"
    env:
      # An unset address fails the run rather than skipping it.
      LIMES_REDIS_REQUIRED: "1"
    cmds:
      - go test -race -count=1 -run '^TestContractOnRedis$' ./...

  fmt:
    desc: "gofmt -s -w over every module — the half of fmt:check that rewrites; goimports is not run, as it adds imports this tree does not use"
    cmds:
      - gofmt -s -w .

  lint:all:
    desc: "golangci-lint over every module, the root and each nested one — ./... at the root does not reach a nested module"
    cmds:
      - task: lint
      - for: ['{{.REDISREPLAY_DIR}}', '{{.OTELMETRIC_DIR}}', '{{.EXCHANGE_DIR}}', '{{.BISCUIT_DIR}}', '{{.PGSTORE_DIR}}', '{{.PGCONTAINER_DIR}}', '{{.EXAMPLES_DIR}}']
        task: lint:module
        vars:
          DIR: '{{.ITEM}}'

  lint:module:
    internal: true
    desc: "golangci-lint over the nested module in DIR, with the root's configuration"
    dir: '{{.DIR}}'
    cmds:
      - go tool -modfile={{.ROOT_DIR}}/{{.GOLANGCI_LINT_MODFILE}} golangci-lint run --config {{.ROOT_DIR}}/.golangci.yml ./...

  lint:
    desc: "golangci-lint over the module, the version tools/golangci-lint pins — the one CI runs; flags go after --, as in task lint -- --concurrency 1"
    cmds:
      - go tool -modfile={{.GOLANGCI_LINT_MODFILE}} golangci-lint run {{.CLI_ARGS}} ./...

  vuln:
    desc: "govulncheck — vulnerabilities this module's code actually reaches"
    cmds:
      - go tool -modfile={{.TOOLS_MODFILE}} govulncheck ./...

  verify:tidy:
    desc: "Fail when any module's go.mod or go.sum (root, tools, tools/yq, tools/golangci-lint) is not what go mod tidy writes, or a download differs from go.sum"
    cmds:
      - go mod tidy -diff
      - go mod verify
      - cmd: go mod tidy -diff
        dir: tools
      - cmd: go mod tidy -diff
        dir: tools/yq
      - cmd: go mod tidy -diff
        dir: tools/golangci-lint

  verify:32-bit:
    desc: "go vet, tests included, for a 32-bit GOARCH — where an untyped constant past 2^31 stops the build"
    env:
      GOOS: linux
      GOARCH: "386"
    cmds:
      - go vet ./...

  verify:workflows:
    desc: "actionlint over the workflows"
    cmds:
      - go tool -modfile={{.TOOLS_MODFILE}} actionlint

  verify:ci:
    desc: "Type-check and test the TypeScript the workflows run (.github/ci)"
    dir: '{{.CI_DIR}}'
    preconditions:
      - sh: test -d node_modules/typescript
        msg: "the CI scripts' dependencies are not installed — npm ci --ignore-scripts --prefix .github/ci"
      # The marker checks count commits through the release's own analyzer.
      - sh: test -d ../release/node_modules/@semantic-release/commit-analyzer
        msg: "the release tooling is not installed — npm ci --ignore-scripts --prefix .github/release"
    # The tests drive commands through refusals on purpose: those print as
    # plain lines, not as annotations of the run (lib/actions.ts).
    env:
      LIMES_CI_ANNOTATIONS: "off"
    cmds:
      - node_modules/.bin/tsc -p .
      - node --test

  verify:release-rules:
    desc: "Fail when a commit type cuts a different release than it should, or a breaking change is missing from the notes"
    preconditions:
      - sh: test -d .github/release/node_modules/@semantic-release/commit-analyzer
        msg: "the release tooling is not installed — npm ci --ignore-scripts --prefix .github/release"
    cmds:
      - node .github/release/release-rules.test.mjs
      - node .github/release/release-notes.test.mjs
      - node .github/release/major-guard.test.mjs
      - node .github/release/module-commits.test.mjs
