# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# limes — the module's gates.
#
#   task --list
#   task verify-all      # before pushing; CI runs the same task
#
# One Go module at the root, so the shared library's Go verbs are flattened in:
# `task test`, not `task go:test`.

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v11.1.2'

includes:
  go:
    taskfile: '{{printf .TASKLIB "go"}}'
    dir: .
    flatten: true
    vars: { PROJECT_NAME: limes }

tasks:
  default:
    cmds:
      - task --list

  verify-all:
    desc: "gofmt + golangci-lint + the unit suite + govulncheck — what CI runs"
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
      - task: vuln

  example:
    desc: "Run the quickstart walkthrough end to end"
    cmds:
      - go run ./example
