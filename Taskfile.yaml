# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# limes — the module's gates.
#
#   task --list
#   task verify-all      # before pushing; CI runs the same task
#
# The library is the module at the root, so the shared library's Go verbs are
# flattened in: `task test`, not `task go:test`. The redisreplay module has a
# gate of its own, verify:redisreplay.

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v11.2.2'
  # The developer tools' own module; see its go.mod.
  TOOLS_MODFILE: tools/go.mod
  # The Redis replay cache, a module of its own so the root never resolves a
  # Redis client.
  REDISREPLAY_DIR: redisreplay
  # The reference PostgreSQL store, a module of its own: `./...` from the
  # root does not reach it.
  PGSTORE_DIR: pgstore
  # The runnable examples, a module of their own since one of them uses
  # pgstore and its driver.
  EXAMPLES_DIR: examples
  # LIMES_MODULE is the root module's path, which pgstore replaces with this
  # checkout.
  LIMES_MODULE: github.com/oleg-tkachuk/limes

includes:
  go:
    taskfile: '{{printf .TASKLIB "go"}}'
    # The sha256 of this Taskfile at TASKLIB's ref. A tag can be moved, and
    # the gate runs it with --yes, so a moved tag fails rather than runs.
    # Task does not template this field; bump it with the ref, from the
    # checksum Task reports it got.
    checksum: 4de07ad9c5fdd046002f1fd22bb68c40e4456d07f8d7b6c3e51253940267dada
    dir: .
    flatten: true
    # Its vuln runs a govulncheck from PATH; the one below runs the version
    # tools/go.mod pins.
    excludes: [vuln]
    # GO_TEST_FLAGS spelled out, so a bump of the library cannot drop -race.
    vars: { PROJECT_NAME: limes, GO_TEST_FLAGS: -race -short }

tasks:
  default:
    cmds:
      - task --list

  verify-all:
    desc: "gofmt + go mod tidy/verify + golangci-lint + a 32-bit build + the unit suite + the example + govulncheck + actionlint + the workflow scripts + the release rules and notes + the redisreplay module + pgstore's static checks + the examples that need no database — what CI runs, but test:pgstore and test:examples:pgstore"
    cmds:
      - task: fmt:check
      - task: verify:tidy
      - task: lint
      - task: verify:32-bit
      - task: test
      - task: verify:example
      - task: vuln
      - task: verify:workflows
      - task: verify:scripts
      - task: verify:release-rules
      - task: verify:redisreplay
      - task: verify:pgstore
      - task: verify:examples

  verify:redisreplay:
    desc: "The redisreplay module's own gate: go mod tidy/verify, go vet, golangci-lint, the unit suite and govulncheck — ./... at the root does not reach a nested module"
    dir: '{{.REDISREPLAY_DIR}}'
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go vet ./...
      - golangci-lint run --config ../.golangci.yml ./...
      - go test -race -short ./...
      - go tool -modfile=../{{.TOOLS_MODFILE}} govulncheck ./...

  verify:pgstore:
    desc: "pgstore, its own module: go mod tidy/verify, go vet, golangci-lint and govulncheck — what needs no database; test:pgstore runs its tests"
    dir: '{{.PGSTORE_DIR}}'
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go vet ./...
      - golangci-lint run --config ../.golangci.yml ./...
      - go tool -modfile=../{{.TOOLS_MODFILE}} govulncheck ./...

  verify:examples:
    desc: "The examples module: go mod tidy/verify, go vet, golangci-lint, its tests, and every example that needs no database, run to the end — each exits non-zero on a step that does not do what it says"
    dir: '{{.EXAMPLES_DIR}}'
    cmds:
      - go mod tidy -diff
      - go mod verify
      - go vet ./...
      - golangci-lint run --config ../.golangci.yml ./...
      - go test -race -short ./...
      - go run ./issue-verify
      - go run ./delegation
      - go run ./metering

  test:examples:pgstore:
    desc: "Run the pgstore example to the end against PostgreSQL in a container — needs a running Docker"
    dir: '{{.EXAMPLES_DIR}}'
    cmds:
      - go run ./pgstore

  test:pgstore:
    desc: "pgstore's tests, the contract suites among them, against PostgreSQL in a container — needs a running Docker"
    dir: '{{.PGSTORE_DIR}}'
    cmds:
      - go test -race -count=1 ./...

  test:pgstore:pinned:
    desc: "pgstore's tests against the limes its go.mod requires, as a consumer's build resolves it, not the limes of this commit — needs a running Docker and the module proxy"
    dir: '{{.PGSTORE_DIR}}'
    vars:
      # A copy of go.mod without the replace, in a scratch directory: the
      # tracked go.mod and go.sum stay as they are.
      PINNED_DIR:
        sh: mktemp -d
    cmds:
      - defer: rm -rf '{{.PINNED_DIR}}'
      - cp go.mod go.sum '{{.PINNED_DIR}}/'
      - go mod edit -dropreplace={{.LIMES_MODULE}} '{{.PINNED_DIR}}/go.mod'
      - go test -modfile='{{.PINNED_DIR}}/go.mod' -mod=mod -race -count=1 ./...

  test:redisreplay:
    desc: "redisreplay's contract against a real Redis at LIMES_REDIS_ADDR (host:port) — miniredis runs another Lua, so this is the check of the script itself"
    dir: '{{.REDISREPLAY_DIR}}'
    preconditions:
      - sh: test -n "$LIMES_REDIS_ADDR"
        msg: "LIMES_REDIS_ADDR is not set — start a Redis and name it as host:port"
    env:
      # An unset address fails the run rather than skipping it.
      LIMES_REDIS_REQUIRED: "1"
    cmds:
      - go test -race -count=1 -run '^TestContractOnRedis$' ./...

  verify:example:
    desc: "Run ./example end to end: it exits non-zero on any step that does not do what the README says"
    cmds:
      - go run ./example

  vuln:
    desc: "govulncheck — vulnerabilities this module's code actually reaches"
    cmds:
      - go tool -modfile={{.TOOLS_MODFILE}} govulncheck ./...

  verify:tidy:
    desc: "Fail when any module's go.mod or go.sum (root, tools, tools/yq) is not what go mod tidy writes, or a download differs from go.sum"
    cmds:
      - go mod tidy -diff
      - go mod verify
      - cmd: go mod tidy -diff
        dir: tools
      - cmd: go mod tidy -diff
        dir: tools/yq

  verify:32-bit:
    desc: "go vet, tests included, for a 32-bit GOARCH — where an untyped constant past 2^31 stops the build"
    env:
      GOOS: linux
      GOARCH: "386"
    cmds:
      - go vet ./...

  verify:workflows:
    desc: "actionlint over the workflows"
    cmds:
      - go tool -modfile={{.TOOLS_MODFILE}} actionlint

  verify:scripts:
    desc: "Test the shell scripts the workflows run"
    cmds:
      - for: [api-break-check, check-modules, check-range, ci-diff, ci-job-passed, ci-relevant, ci-run-check, gh-retry, go-floor-check, marker-check, new-release-tag, publish-release, queue-auto-merge, rebase-behind, release-catch-up, release-head-check, require-released-limes, unpublished-tags, warm-go-proxy]
        cmd: bash .github/scripts/{{.ITEM}}.test.sh

  verify:release-rules:
    desc: "Fail when a commit type cuts a different release than it should, or a breaking change is missing from the notes"
    preconditions:
      - sh: test -d .github/release/node_modules/@semantic-release/commit-analyzer
        msg: "the release tooling is not installed — npm ci --ignore-scripts --prefix .github/release"
    cmds:
      - node .github/release/release-rules.test.mjs
      - node .github/release/release-notes.test.mjs
      - node .github/release/major-guard.test.mjs
      - node .github/release/module-commits.test.mjs
