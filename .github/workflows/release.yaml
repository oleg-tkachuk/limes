name: Release

# Dispatched by ci.yaml once the checks on a push to main have passed.
#
# A release is a vX.Y.Z tag — the Go proxy reads the tag, so nothing else is
# published — and the GitHub release that announces it. A nested module's tag
# is <dir>/vX.Y.Z. Nothing is tagged when no release was due.
#
# workflow_run is the obvious trigger and is refused by zizmor's
# dangerous-triggers audit. A plain `push` trigger would not help: GitHub
# starts no workflow run from an event GITHUB_TOKEN caused.
# repository_dispatch is one of the documented exceptions that always create a
# run, so CI dispatches this with its own GITHUB_TOKEN — no extra credential,
# no dangerous trigger.
#
# Deliberately no workflow_dispatch: it would let a release be cut from an
# untested main with one click, which is what the gate in ci.yaml prevents.
on:
  repository_dispatch:
    types: [release]

permissions: {}

concurrency:
  # Two dispatches close together would both compute "next version" from the
  # same last tag and could push conflicting ones. Never cancel-in-progress: a
  # run killed mid-push can leave a tag with no release behind it.
  group: release
  cancel-in-progress: false


env:
  # The release tooling's runtime, as ci.yaml pins it.
  # renovate: datasource=node-version depName=node
  NODE_VERSION: "24.21.0"
  # Each nested module's name in .github/release/modules.cjs, which is also
  # its directory and the prefix of its tags. release-rules.test.mjs fails
  # when a module there is not released here.
  REDISREPLAY_MODULE: redisreplay
  PGSTORE_MODULE: pgstore

jobs:
  release:
    name: Tag and publish the release
    # Only CI's own dispatch, sent with its GITHUB_TOKEN. This is a filter,
    # not the control: any write token can send a repository_dispatch, and the
    # payload is the sender's to write. The control is the step below, which
    # asks the API whether the run the payload names passed on main, for the
    # commit it names (.github/scripts/ci-run-check.sh).
    if: github.event.sender.login == 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release pushes the tag; gh creates the release
      actions: read # the dispatching CI run and its jobs
    outputs:
      # The root module's release tag this run pushed or published; empty
      # when none.
      limes-tag: ${{ steps.limes-tag.outputs.tag }}
    steps:
      # No persist-credentials: false — semantic-release pushes the tag it
      # creates, so this is the one checkout here that needs its credentials.
      #
      # Deliberately no `ref:`. A repository_dispatch run checks out the head
      # of the default branch, which is a BRANCH — and semantic-release has to
      # be on one of its configured release branches to release at all. The
      # dispatched sha is printed below instead.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release derives the next version from the commit history.
          fetch-depth: 0

      # A dispatched run is not linked to its trigger in the UI the way a
      # workflow_run is, so without this the run says nothing about where it
      # came from.
      - name: Say what dispatched this
        env:
          SHA: ${{ github.event.client_payload.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id }}
        run: printf 'dispatched by CI run %s for commit %s\n' "${CI_RUN:-unknown}" "${SHA:-unknown}"

      - name: Require the dispatching CI run to have passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.client_payload.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id }}
        run: ./.github/scripts/ci-run-check.sh "$CI_RUN" "$SHA"

      # The checkout above is main's head, which can be newer than the commit
      # whose CI dispatched this run. Only that commit's code is released: a
      # head past it with documentation alone is released in its place, any
      # other by its own CI run. See .github/scripts/release-head-check.sh.
      - name: Release only the commit CI passed
        id: head
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: ./.github/scripts/release-head-check.sh "$SHA" >>"$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.head.outputs.release == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No dependency cache: this job holds a write token, and a cache
          # another run wrote is not something to restore into it.
          package-manager-cache: false

      # .github/release/package-lock.json pins semantic-release and its preset,
      # so this installs the versions committed here rather than a marketplace
      # action's own.
      - name: Install semantic-release
        if: steps.head.outputs.release == 'true'
        working-directory: .github/release
        # No package's install script runs while this job's write token sits
        # in the checkout.
        run: npm ci --ignore-scripts

      # semantic-release publishes nothing from a branch behind its remote,
      # and says so with exit 0: whatever landed on main since the checkout
      # is caught up with now, and the decision made again against it. See
      # .github/scripts/release-catch-up.sh.
      - name: Catch up with main
        id: catchup
        if: steps.head.outputs.release == 'true'
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: ./.github/scripts/release-catch-up.sh "$SHA" >>"$GITHUB_OUTPUT"

      # What HEAD carried before this run, so the steps after it can tell a tag
      # it pushed from one an earlier dispatch to the same commit pushed.
      - name: Note the tags already on HEAD
        if: steps.catchup.outputs.release == 'true'
        run: git tag --points-at HEAD >"$RUNNER_TEMP/tags-before"

      # Each module is released on its own line, from the commits that touch
      # it: the root module first, then each nested one, whose tags carry its
      # directory (.github/release/modules.cjs). A failure of a nested
      # module's release leaves the root's published.
      #
      # Run where its config and lockfile live; git finds the repository from
      # there.
      - name: Compute and push the tag of the root module
        if: steps.catchup.outputs.release == 'true'
        working-directory: .github/release
        run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # release-notes-file.cjs writes the notes generated from the
          # commits here, breaking changes first.
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md

      # Read from git rather than parsing semantic-release's prose. A tag on
      # HEAD with no release, left by a run that failed after pushing it, is
      # published by a re-run — see .github/scripts/new-release-tag.sh.
      #
      # Notes for people: the ones semantic-release generated from the
      # commits — breaking changes first, whatever the pull requests' labels —
      # then GitHub's list of merged pull requests since the module's previous
      # tag, shaped by .github/release.yml. A re-run publishing an earlier
      # run's tag has no generated notes and gets the list alone. Then the Go
      # proxy is told of the tag, so `go get …@latest` sees it now rather than
      # whenever the proxy next refreshes; the release stands without it. See
      # .github/scripts/publish-release.sh.
      - name: Publish the release of the root module
        if: steps.catchup.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: ./.github/scripts/publish-release.sh new "$RUNNER_TEMP/tags-before"

      # For the job below, which proposes the nested modules' requirement of
      # it. See .github/scripts/new-release-tag.sh.
      - name: Note the root module's release
        id: limes-tag
        if: steps.catchup.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf 'tag=%s\n' "$(./.github/scripts/new-release-tag.sh "$RUNNER_TEMP/tags-before")" >>"$GITHUB_OUTPUT"

      - name: Compute and push the tag of redisreplay
        if: steps.catchup.outputs.release == 'true'
        working-directory: .github/release
        run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODULE: ${{ env.REDISREPLAY_MODULE }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes-redisreplay.md

      - name: Publish the release of redisreplay
        if: steps.catchup.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes-redisreplay.md
        run: ./.github/scripts/publish-release.sh new "$RUNNER_TEMP/tags-before" "$REDISREPLAY_MODULE/"

      # pgstore is released only once its tests against the limes its go.mod
      # requires passed in the dispatching run: a change to limes that pgstore
      # must follow lands with pgstore, and pgstore waits here, released with
      # everything since, until the job below raises its requirement to the
      # limes this run released. See .github/scripts/ci-job-passed.sh.
      - name: Require pgstore's tests against the released limes
        id: pgstore-gate
        if: steps.catchup.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id }}
        run: ./.github/scripts/ci-job-passed.sh "$CI_RUN" "PostgreSQL store, released limes" >>"$GITHUB_OUTPUT"

      - name: Compute and push the tag of pgstore
        if: steps.catchup.outputs.release == 'true' && steps.pgstore-gate.outputs.passed == 'true'
        working-directory: .github/release
        run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODULE: ${{ env.PGSTORE_MODULE }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes-pgstore.md

      - name: Publish the release of pgstore
        if: steps.catchup.outputs.release == 'true' && steps.pgstore-gate.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes-pgstore.md
        run: ./.github/scripts/publish-release.sh new "$RUNNER_TEMP/tags-before" "$PGSTORE_MODULE/"

      # A run that pushed its tag and failed before publishing it is re-run
      # above only while that tag is still on HEAD. Once main has moved on,
      # this publishes it: every recent tag below HEAD with no release, as
      # not the latest, with GitHub's list of merged pull requests for notes.
      # See .github/scripts/unpublished-tags.sh.
      - name: Publish releases an earlier run left behind
        if: steps.catchup.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./.github/scripts/publish-release.sh left-behind
          ./.github/scripts/publish-release.sh left-behind "$REDISREPLAY_MODULE/"
          ./.github/scripts/publish-release.sh left-behind "$PGSTORE_MODULE/"

  # Each limes release is followed by a pull request per nested module that
  # raises the module's requirement to it: pgstore is released only once its
  # tests pass against the limes it requires, so its release waits for that
  # merge. It acts through AUTOMERGE_TOKEN, never GITHUB_TOKEN: a branch
  # pushed with GITHUB_TOKEN would get no CI, and its pull request would wait
  # forever on its required check (auto-merge.yaml, which then queues it).
  # Without the secret it warns and does nothing. See
  # .github/scripts/require-released-limes.sh.
  require-released-limes:
    name: Propose the nested modules' requirement of the released limes
    needs: release
    if: needs.release.outputs.limes-tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout; the push and the pull request act through AUTOMERGE_TOKEN
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No module cache: this job holds a write token, and a cache another
          # run wrote is not something to restore into it.
          cache: false

      - name: Propose each nested module's requirement
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          LIMES_TAG: ${{ needs.release.outputs.limes-tag }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        # One module's failure leaves the others proposed, and fails the step.
        run: |
          set -uo pipefail
          failed=0
          for module in "$REDISREPLAY_MODULE" "$PGSTORE_MODULE"; do
            ./.github/scripts/require-released-limes.sh "$module" "$LIMES_TAG" || failed=1
          done
          exit "$failed"
