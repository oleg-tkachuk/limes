name: Release

# Dispatched by ci.yaml once the checks on a push to main have passed, and
# run by hand from main.
#
# A run CI dispatched releases a module only once the commits since its last
# release are due by .github/release/release-policy.json: enough of them, by
# the level each cuts, or one that is released at once. A run by hand
# releases whatever is pending, or with the prerelease channel tags a release
# candidate, vX.Y.Z-rc.N; either may name one module. Every run, by hand
# too, releases only a commit a CI run on main passed.
#
# A release is a vX.Y.Z tag — the Go proxy reads the tag, so nothing else is
# published — and the GitHub release that announces it. A nested module's tag
# is <dir>/vX.Y.Z. Nothing is tagged when no release was due.
#
# workflow_run is the obvious trigger and is refused by zizmor's
# dangerous-triggers audit. A plain `push` trigger would not help: GitHub
# starts no workflow run from an event GITHUB_TOKEN caused.
# repository_dispatch is one of the documented exceptions that always create a
# run, so CI dispatches this with its own GITHUB_TOKEN — no extra credential,
# no dangerous trigger.
on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      channel:
        description: A release, or a release candidate (vX.Y.Z-rc.N)
        type: choice
        options: [release, prerelease]
        default: release
      module:
        description: The module to release, or all of them (.github/release/modules.cjs)
        type: choice
        options: [all, limes, redisreplay, pgstore, otelmetric]
        default: all

permissions: {}

concurrency:
  # Two dispatches close together would both compute "next version" from the
  # same last tag and could push conflicting ones. Never cancel-in-progress: a
  # run killed mid-push can leave a tag with no release behind it.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish the release
    # Only CI's own dispatch, sent with its GITHUB_TOKEN. This is a filter,
    # not the control: any write token can send a repository_dispatch, and the
    # payload is the sender's to write. The control is the step below, which
    # asks the API whether the run the payload names passed on main, for the
    # commit it names (.github/ci/ci-run.ts).
    # A run by hand needs write access to start, and releases only from main.
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.sender.login == 'github-actions[bot]') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release pushes the tag; the API publishes the release
      actions: read # the dispatching CI run and its jobs
    outputs:
      # The root module's release tag this run pushed or published; empty
      # when none.
      limes-tag: ${{ steps.modules.outputs.limes-tag }}
    steps:
      # No persist-credentials: false — semantic-release pushes the tag it
      # creates, so this is the one checkout here that needs its credentials.
      #
      # Deliberately no `ref:`. A repository_dispatch run checks out the head
      # of the default branch, which is a BRANCH — and semantic-release has to
      # be on one of its configured release branches to release at all. The
      # dispatched sha is printed below instead.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release derives the next version from the commit history.
          fetch-depth: 0

      # A dispatched run is not linked to its trigger in the UI the way a
      # workflow_run is, so without this the run says nothing about where it
      # came from.
      - name: Say what started this
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.client_payload.sha || github.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id }}
        run: printf '%s for commit %s, CI run %s\n' "$EVENT" "${SHA:-unknown}" "${CI_RUN:-to be found}"

      # Node, the CI scripts and the semantic-release that
      # .github/release/package-lock.json pins, with no dependency cache —
      # this job holds a write token, and a cache another run wrote is not
      # something to restore into it — and no package's install script.
      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci
        with:
          release-tooling: true

      # A run by hand has no dispatching CI run: the newest passed push run of
      # ci.yaml on main for the commit stands in for it, and none at all
      # stops the release.
      - name: Find the CI run that passed this commit
        id: find
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: node .github/ci/ci-run.ts find "$SHA"

      # The control behind the sender filter above: the API's answer about
      # the run the payload names. See .github/ci/ci-run.ts.
      - name: Require the dispatching CI run to have passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.client_payload.sha || github.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id || steps.find.outputs.run-id }}
        run: node .github/ci/ci-run.ts vouches "$CI_RUN" "$SHA"

      # The checkout above is main's head, which can be newer than the commit
      # whose CI dispatched this run. Only that commit's code is released: a
      # head past it with documentation alone is released in its place, any
      # other by its own CI run. See .github/ci/release-head.ts.
      - name: Release only the commit CI passed
        id: head
        env:
          SHA: ${{ github.event.client_payload.sha || github.sha }}
        run: node .github/ci/release-head.ts check "$SHA"

      # semantic-release publishes nothing from a branch behind its remote,
      # and says so with exit 0: whatever landed on main since the checkout
      # is caught up with now, and the decision made again against it. See
      # .github/ci/release-head.ts.
      - name: Catch up with main
        id: catchup
        if: steps.head.outputs.release == 'true'
        env:
          SHA: ${{ github.event.client_payload.sha || github.sha }}
        run: node .github/ci/release-head.ts catch-up "$SHA"

      # Every module, each on its own line from the commits that touch it
      # (.github/release/modules.cjs): its tag computed and pushed by the
      # pinned semantic-release, its GitHub release published — the notes
      # generated from the commits, breaking changes first, then GitHub's list
      # of merged pull requests since its previous tag (.github/release.yml) —
      # and the Go proxy told of it. pgstore waits for its tests against the
      # released limes to have passed in the dispatching run. Then every tag
      # an earlier run pushed and left unpublished is published. semantic-
      # release logs every commit message it reads, and this step holds a
      # write token: no line of that log may act as a workflow command. See
      # .github/ci/release.ts.
      - name: Release every module
        id: modules
        if: steps.catchup.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id || steps.find.outputs.run-id }}
          # Set by hand; a dispatched run releases by the policy.
          CHANNEL: ${{ inputs.channel || 'release' }}
          MODULE: ${{ inputs.module || 'all' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node .github/ci/release.ts

  # Each limes release is followed by a pull request per nested module that
  # raises the module's requirement to it: pgstore is released only once its
  # tests pass against the limes it requires, so its release waits for that
  # merge. It acts through AUTOMERGE_TOKEN, never GITHUB_TOKEN: a branch
  # pushed with GITHUB_TOKEN would get no CI, and its pull request would wait
  # forever on its required check (auto-merge.yaml, which then merges it).
  # Without the secret it warns and does nothing. See
  # .github/ci/require-limes.ts.
  require-released-limes:
    name: Propose the nested modules' requirement of the released limes
    needs: release
    if: needs.release.outputs.limes-tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # AUTOMERGE_TOKEN lives in this environment, which only main may deploy to
    # (auto-merge.yaml).
    environment: automerge
    permissions:
      contents: read # the checkout; the push and the pull request act through AUTOMERGE_TOKEN
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No module cache: this job holds a write token, and a cache another
          # run wrote is not something to restore into it.
          cache: false

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      # One module's failure leaves the others proposed, and fails the step.
      - name: Propose each nested module's requirement
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          LIMES_TAG: ${{ needs.release.outputs.limes-tag }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node .github/ci/require-limes.ts "$LIMES_TAG"
