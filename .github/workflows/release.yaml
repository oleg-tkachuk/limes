name: Release

# Dispatched by ci.yaml once the checks on a push to main have passed, and
# run by hand from main.
#
# Every module is released from one commit (docs/adr/0016-one-release-commit.md).
# A run first tags each release a merged release pull request planned: the
# newest entry of a module's CHANGELOG.md that no tag names yet. It then
# proposes the next release pull request: each module whose commits since its
# last release are due by .github/release/release-policy.json — enough of
# them, by the level each cuts, or one that is released at once —, or, by
# hand, whatever is pending, its changelog entry written and every nested
# module that requires limes raised to the limes it releases. A run by hand
# with the prerelease channel instead tags a release candidate, vX.Y.Z-rc.N —
# with next_major, one of limes's next major, v1.0.0-rc.N, whose API may still
# break before 1.0 —; either may name one module. Every run, by hand too,
# acts only on a commit a CI run on main passed.
#
# A release is a vX.Y.Z tag — the Go proxy reads the tag, so nothing else is
# published — and the GitHub release that announces it. A nested module's tag
# is <dir>/vX.Y.Z. Nothing is tagged when no release was due.
#
# workflow_run is the obvious trigger and is refused by zizmor's
# dangerous-triggers audit. A plain `push` trigger would not help: GitHub
# starts no workflow run from an event GITHUB_TOKEN caused.
# repository_dispatch is one of the documented exceptions that always create a
# run, so CI dispatches this with its own GITHUB_TOKEN — no extra credential,
# no dangerous trigger.
on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      channel:
        description: A release, or a release candidate (vX.Y.Z-rc.N)
        type: choice
        options: [release, prerelease]
        default: release
      module:
        description: The module to release, or all of them (.github/release/modules.cjs)
        type: choice
        options: [all, limes, redisreplay, pgstore, otelmetric, exchange, biscuit]
        default: all
      next_major:
        description: With the prerelease channel, a candidate of limes's next major (v1.0.0-rc.N) rather than of its next version
        type: boolean
        default: false

# Each run is named after what started it, so the run behind a release, or
# behind one that stopped, is found by its name: CI's dispatch by the run
# that vouches for it and the commit, a run by hand by its channel and
# module. The version is derived inside the run by semantic-release, so no
# name carries one.
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('Release dispatched by CI run {0} for {1}', github.event.client_payload.ci_run_id, github.event.client_payload.sha)
      || format('Release by hand: {0} of {1} at {2}', inputs.channel, inputs.module, github.sha) }}

permissions: {}

concurrency:
  # Two dispatches close together would both compute "next version" from the
  # same last tag and could push conflicting ones. Never cancel-in-progress: a
  # run killed mid-push can leave a tag with no release behind it.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish the release
    # Only CI's own dispatch, sent with its GITHUB_TOKEN. This is a filter,
    # not the control: any write token can send a repository_dispatch, and the
    # payload is the sender's to write. The control is the step below, which
    # asks the API whether the run the payload names passed on main, for the
    # commit it names (.github/ci/ci-run.ts).
    # A run by hand needs write access to start, and releases only from main.
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.sender.login == 'github-actions[bot]') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # RELEASE_DEPLOY_KEY lives in this environment, which only main may deploy
    # to (repo-settings.ts): no other branch's copy of a workflow can read it.
    environment: release
    permissions:
      contents: write # the API publishes the release; the deploy key pushes the tag
      actions: read # the dispatching CI run and its jobs
    outputs:
      # true once the run found its commit releasable; the next release is
      # then proposed.
      releasable: ${{ steps.catchup.outputs.release }}
    steps:
      # No credentials kept: every tag is pushed over SSH with the deploy key,
      # and main is fetched from a public repository.
      #
      # Deliberately no `ref:`. A repository_dispatch run checks out the head
      # of the default branch, which is a BRANCH — and semantic-release has to
      # be on one of its configured release branches to release at all. The
      # dispatched sha is printed below instead.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, and the commits they and the changelogs are read from.
          fetch-depth: 0

      # Node, the CI scripts and the semantic-release that
      # .github/release/package-lock.json pins, with no dependency cache —
      # this job holds a write token, and a cache another run wrote is not
      # something to restore into it — and no package's install script.
      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci
        with:
          release-tooling: true

      # A run by hand has no dispatching CI run: the newest push run of
      # ci.yaml on main for the commit whose required jobs passed stands in
      # for it, and none at all stops the release.
      - name: Find the CI run that passed this commit
        id: find
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: node .github/ci/ci-run.ts find "$SHA"

      # The control behind the sender filter above: the API's answer about
      # the run the payload names. See .github/ci/ci-run.ts.
      - name: Require the dispatching CI run to have passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.client_payload.sha || github.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id || steps.find.outputs.run-id }}
        run: node .github/ci/ci-run.ts vouches "$CI_RUN" "$SHA"

      # A dispatched run is not linked to its trigger in the UI the way a
      # workflow_run is, so without this the run says nothing about where it
      # came from. Printed only once the API vouched for the payload: before,
      # its values are any sender's, and a log line of their choosing.
      - name: Say what started this
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.client_payload.sha || github.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id }}
        run: printf '%s for commit %s, CI run %s\n' "$EVENT" "${SHA:-unknown}" "${CI_RUN:-to be found}"

      # The checkout above is main's head, which can be newer than the commit
      # whose CI dispatched this run. Only that commit's code is released: a
      # head past it with documentation alone is released in its place, any
      # other by its own CI run. See .github/ci/release-head.ts.
      - name: Release only the commit CI passed
        id: head
        env:
          SHA: ${{ github.event.client_payload.sha || github.sha }}
        run: node .github/ci/release-head.ts check "$SHA"

      # semantic-release publishes nothing from a branch behind its remote,
      # and says so with exit 0: whatever landed on main since the checkout
      # is caught up with now, and the decision made again against it. See
      # .github/ci/release-head.ts.
      - name: Catch up with main
        id: catchup
        if: steps.head.outputs.release == 'true'
        env:
          SHA: ${{ github.event.client_payload.sha || github.sha }}
        run: node .github/ci/release-head.ts catch-up "$SHA"

      # The releases a merged release pull request planned, each tagged on
      # the commit that merged it with the deploy key, published with its
      # changelog entry as its notes, and the Go proxy told of it; a nested
      # module no tag names yet has its release line started first. See
      # .github/ci/release-tag.ts.
      - name: Tag the planned releases
        id: tag
        if: steps.catchup.outputs.release == 'true' && (inputs.channel || 'release') == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The deploy key every tag is pushed with: the one actor the
          # release-tag-creation ruleset lets create a release tag
          # (.github/ci/lib/deploy-key.ts, repo-settings.ts).
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: node .github/ci/release-tag.ts

      # A release candidate of each module asked for, from main's head: the
      # notes of a semantic-release dry run, which logs every commit message
      # it reads while this step holds a write token, so no line of that log
      # may act as a workflow command. See .github/ci/release.ts.
      - name: Cut the release candidates
        id: candidates
        if: steps.catchup.outputs.release == 'true' && inputs.channel == 'prerelease'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
          CHANNEL: ${{ inputs.channel }}
          MODULE: ${{ inputs.module || 'all' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          NEXT_MAJOR: ${{ inputs.next_major || false }}
        run: node .github/ci/release.ts

  # After the tags, the next release pull request: one commit raising each
  # nested module's requirement of limes and adding each changelog entry,
  # from the semantic-release dry runs of main's head. A pull request that
  # cuts a major is a draft, which auto-merge.yaml leaves for a person. It
  # acts through AUTOMERGE_TOKEN, never GITHUB_TOKEN: a branch pushed with
  # GITHUB_TOKEN would get no CI, and its pull request would wait forever on
  # its required check (auto-merge.yaml, which then merges it). Without the
  # secret it warns and does nothing. See .github/ci/release-plan.ts.
  propose-release:
    name: Propose the next release
    needs: release
    if: needs.release.outputs.releasable == 'true' && (inputs.channel || 'release') == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # AUTOMERGE_TOKEN lives in this environment, which only main may deploy
    # to (auto-merge.yaml).
    environment: automerge
    permissions:
      contents: read # the checkout; the push and the pull request act through AUTOMERGE_TOKEN
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit and tag: the dry runs count from each module's last
          # release, which the job before may have just tagged.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No module cache: this job holds a write token, and a cache another
          # run wrote is not something to restore into it.
          cache: false

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci
        with:
          release-tooling: true

      - name: Propose the next release
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          MODULE: ${{ inputs.module || 'all' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node .github/ci/release-plan.ts
