name: CI

# The whole pipeline: the module's gate, an audit of these workflows, and — on
# a green push to main — a dispatch to release.yaml.

on:
  push:
    branches: [main]
  pull_request:
    # edited: the title becomes the merge commit's body, which the release
    # reads, so a title changed after green is checked again.
    types: [opened, synchronize, reopened, edited]
  # A run by hand has no diff to classify, so it runs every check. It never
  # dispatches a release: that job requires a push event.
  workflow_dispatch:

# Nothing at the top level — each job asks for what it needs.
permissions: {}

# A pull request's runs share a group and the newest cancels the rest. Each
# push to main gets a group of its own: GitHub keeps one pending run per
# group and cancels it when another joins, so a shared group would drop the
# CI — and the release dispatch — of a commit merged between two others.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pinned tools, one place each. A floating tool changes what the gate checks
# with no commit of ours in between.
env:
  # renovate: datasource=github-releases depName=go-task/task
  TASK_VERSION: "3.54.0"
  # The SHA256 of that release's task_linux_amd64.tar.gz, from its
  # task_checksums.txt: setup-task refuses an archive that does not match,
  # so a release replaced under the same tag fails the run. Renovate moves
  # TASK_VERSION alone; a bump fails here until this follows it.
  TASK_SHA256: "680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb"
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: "1.30.1"
  # The newest patch of the oldest Go the module supports: the `go` directive
  # in go.mod, which is what binds a consumer. The floor job checks they agree.
  # renovate: datasource=golang-version depName=go-floor
  GO_FLOOR_VERSION: "1.26.9"

jobs:
  # Which of the checks below the change reaches: one output per group of
  # them, and whether it is more than documentation. .github/ci/changes.ts
  # holds the groups and the list of documentation paths that change nothing.
  changes:
    name: Changed paths
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      code: ${{ steps.filter.outputs.code }}
      root: ${{ steps.filter.outputs.root }}
      pgstore: ${{ steps.filter.outputs.pgstore }}
      redisreplay: ${{ steps.filter.outputs.redisreplay }}
      otelmetric: ${{ steps.filter.outputs.otelmetric }}
      examples: ${{ steps.filter.outputs.examples }}
      scripts: ${{ steps.filter.outputs.scripts }}
      verify-tasks: ${{ steps.filter.outputs.verify-tasks }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff below needs both ends of it.
          fetch-depth: 0

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      - name: Classify the diff
        id: filter
        env:
          # A pull request has both ends of its own diff; a push reports the
          # branch's previous head.
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          # A push to main checks everything, whatever its diff reaches.
          EVENT: ${{ github.event_name }}
        # Which diff, and which checks it reaches: .github/ci/changes.ts.
        run: node .github/ci/changes.ts

  # `task verify-all`, exactly as a developer runs it, but its golangci-lint,
  # which the Lint job runs beside it.
  verify:
    name: Verify
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain directive in go.mod decides the Go, so govulncheck checks
      # the standard library this module is built with.
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The cache below replaces setup-go's, which only main should write.
          cache: false

      - name: Restore the Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          mode: restore
          job: verify
          go-version: ${{ steps.go.outputs.go-version }}

      # verify:ci type-checks and tests the CI scripts; verify:release-rules
      # runs the pinned commit analyzer and notes generator against
      # release.config.cjs. Node 24, as release.yaml runs it.
      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci
        with:
          release-tooling: true

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # --yes accepts the first-fetch trust prompt for the shared task library
      # include; unattended, that prompt is a hang rather than a question. A
      # change to the scripts alone runs their part of the gate.
      - name: task verify:gate
        env:
          TASKS: ${{ needs.changes.outputs.verify-tasks }}
        # One of two fixed lists changes.ts sets, a task name a word.
        run: |
          read -r -a tasks <<<"$TASKS"
          task --yes "${tasks[@]}"

      - name: Save the Go caches
        if: success()
        uses: ./.github/actions/go-cache
        with:
          mode: save
          job: verify
          go-version: ${{ steps.go.outputs.go-version }}
          cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          primary-key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # golangci-lint over every module, as `task lint:all` runs it: the part of
  # verify-all with a cache of its own, so neither waits on the other.
  lint:
    name: Lint
    needs: [changes]
    if: >-
      needs.changes.outputs.root == 'true' || needs.changes.outputs.pgstore == 'true' ||
      needs.changes.outputs.redisreplay == 'true' || needs.changes.outputs.otelmetric == 'true' ||
      needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          mode: restore
          job: lint
          go-version: ${{ steps.go.outputs.go-version }}
          extra-paths: ~/.cache/golangci-lint

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task lint:all
        run: task --yes lint:all

      - name: Save the Go caches
        if: success()
        uses: ./.github/actions/go-cache
        with:
          mode: save
          job: lint
          go-version: ${{ steps.go.outputs.go-version }}
          extra-paths: ~/.cache/golangci-lint
          cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          primary-key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # pgstore's tests — storetest and metertest among them — against PostgreSQL
  # in a container, which verify-all leaves out so that it needs no Docker,
  # with the limes of this commit: limes may not break pgstore. The runner's
  # Docker serves testcontainers.
  pgstore:
    name: PostgreSQL store
    needs: [changes]
    if: needs.changes.outputs.root == 'true' || needs.changes.outputs.pgstore == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pgstore/go.mod
          cache: false

      - name: Restore the Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          mode: restore
          job: pgstore
          go-version: ${{ steps.go.outputs.go-version }}

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task test:pgstore
        run: task --yes test:pgstore

      - name: Save the Go caches
        if: success()
        uses: ./.github/actions/go-cache
        with:
          mode: save
          job: pgstore
          go-version: ${{ steps.go.outputs.go-version }}
          cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          primary-key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The pgstore example, run to the end against PostgreSQL in a container: a
  # job of its own beside pgstore's tests, so neither waits on the other.
  examples-pgstore:
    name: PostgreSQL example
    needs: [changes]
    if: needs.changes.outputs.root == 'true' || needs.changes.outputs.pgstore == 'true' || needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/go.mod
          cache: false

      - name: Restore the Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          mode: restore
          job: examples-pgstore
          go-version: ${{ steps.go.outputs.go-version }}

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task test:examples:pgstore
        run: task --yes test:examples:pgstore

      - name: Save the Go caches
        if: success()
        uses: ./.github/actions/go-cache
        with:
          mode: save
          job: examples-pgstore
          go-version: ${{ steps.go.outputs.go-version }}
          cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          primary-key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Each nested module's tests against the limes its go.mod requires, which
  # is what a consumer's build resolves; every other job builds it against the
  # limes of the same commit, through the replace in its go.mod. This gates
  # the module's release, not a merge: a change to limes that a module must
  # follow lands with the module in one pull request, which fails here until
  # limes is released and require-limes.ts raises the module's requirement.
  # Until then release.yaml releases limes and holds the module back, so no
  # module is published that a consumer cannot build. The modules are
  # release.ts's GATED; ci-run.test.ts pins the two lists together.
  #
  # It runs on every push to main, whatever the push changed: release.yaml
  # reads its result to decide whether a module's pending commits may go out,
  # and a run that skipped it would let through a module an earlier run held
  # back.
  released-limes:
    name: Released limes, ${{ matrix.module }}
    needs: [changes]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.relevant == 'true') ||
      needs.changes.outputs.pgstore == 'true' || needs.changes.outputs.redisreplay == 'true' ||
      needs.changes.outputs.otelmetric == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Each module's result gates its own release alone.
      fail-fast: false
      matrix:
        module: [pgstore, redisreplay, otelmetric]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - name: Restore the Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          mode: restore
          job: pinned-${{ matrix.module }}
          go-version: ${{ steps.go.outputs.go-version }}

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task test:pinned
        env:
          MODULE: ${{ matrix.module }}
        run: task --yes test:pinned MODULE="$MODULE"

      - name: Save the Go caches
        if: success()
        uses: ./.github/actions/go-cache
        with:
          mode: save
          job: pinned-${{ matrix.module }}
          go-version: ${{ steps.go.outputs.go-version }}
          cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          primary-key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # redisreplay's contract against a real Redis: verify-all runs it on
  # miniredis, whose scripts run on another Lua. The image is pinned by digest;
  # Renovate moves both together. redisreplay builds the limes of the same
  # commit, so a change to limes reaches it too.
  redis:
    name: Redis replay cache
    needs: [changes]
    if: needs.changes.outputs.root == 'true' || needs.changes.outputs.redisreplay == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      redis:
        image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: redisreplay/go.mod
          cache: false

      - name: Restore the Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          mode: restore
          job: redis
          go-version: ${{ steps.go.outputs.go-version }}

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task test:redisreplay
        env:
          LIMES_REDIS_ADDR: localhost:6379
        run: task --yes test:redisreplay

      - name: Save the Go caches
        if: success()
        uses: ./.github/actions/go-cache
        with:
          mode: save
          job: redis
          go-version: ${{ steps.go.outputs.go-version }}
          cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          primary-key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # verify-all runs on the toolchain go.mod pins. A consumer builds this module
  # with their own Go, as old as the `go` directive allows, so the suite runs
  # on that floor as well — with GOTOOLCHAIN=local, so it cannot quietly
  # switch to a newer one.
  floor:
    name: Test on the oldest supported Go
    needs: [changes]
    if: needs.changes.outputs.root == 'true' || needs.changes.outputs.redisreplay == 'true' || needs.changes.outputs.otelmetric == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_FLOOR_VERSION }}
          cache: false

      - name: Restore the Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          mode: restore
          job: floor
          go-version: ${{ steps.go.outputs.go-version }}

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      - name: Require GO_FLOOR_VERSION to match the go directive
        run: node .github/ci/go-floor.ts "$GO_FLOOR_VERSION"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # A module of its own: ./... at the root does not reach it.
      - name: go vet redisreplay
        working-directory: redisreplay
        run: go vet ./...

      - name: go test redisreplay
        working-directory: redisreplay
        run: go test -race ./...

      - name: go vet otelmetric
        working-directory: otelmetric
        run: go vet ./...

      - name: go test otelmetric
        working-directory: otelmetric
        run: go test -race ./...

      - name: Save the Go caches
        if: success()
        uses: ./.github/actions/go-cache
        with:
          mode: save
          job: floor
          go-version: ${{ steps.go.outputs.go-version }}
          cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          primary-key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The release is computed from commit types, so a break of the Go API that
  # no commit marks breaking would ship as a patch or a feature. Each module
  # the repository releases is checked against the commits that touch it. apidiff
  # compares the pull request's API with its merge base; an incompatible
  # change needs a `!` or a BREAKING CHANGE: footer in one of its commits.
  # A push to main is checked again from the last release, and the release
  # waits for it: a push past the pull request rule was checked by nothing
  # else. See .github/ci/release-checks.ts.
  api:
    name: API compatibility
    needs: [changes]
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (needs.changes.outputs.root == 'true' || needs.changes.outputs.pgstore == 'true' || needs.changes.outputs.redisreplay == 'true' ||
       needs.changes.outputs.otelmetric == 'true' || needs.changes.outputs.scripts == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base and every commit of the pull request.
          fetch-depth: 0

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          mode: restore
          job: api
          go-version: ${{ steps.go.outputs.go-version }}

      # The module table the checks read is JavaScript: .github/release/modules.cjs;
      # a marker counts for a module only when its own release analyzer
      # releases the commit: .github/release/module-commits.cjs.
      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci
        with:
          release-tooling: true

      # Every module, each from its own last release on a push: see
      # .github/ci/check-modules.ts.
      - name: Require a break of the API to be marked breaking
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
        run: node .github/ci/check-modules.ts api

      - name: Save the Go caches
        if: success()
        uses: ./.github/actions/go-cache
        with:
          mode: save
          job: api
          go-version: ${{ steps.go.outputs.go-version }}
          cache-hit: ${{ steps.go-cache.outputs.cache-hit }}
          primary-key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # From v1.0.0 on no commit may mark itself breaking: the release would cut
  # a major the Go proxy ignores. Git alone answers it, so it runs on every
  # pull request — a documentation-only one too, whose marker breaks the
  # release as surely as one beside code — and on every push to main, from
  # the last release, as the API check does. See
  # .github/ci/release-checks.ts.
  markers:
    name: Breaking markers
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base, every commit of the pull request, and the tags
          # that say which release line it builds on.
          fetch-depth: 0

      # The module table the checks read is JavaScript: .github/release/modules.cjs;
      # a marker counts for a module only when its own release analyzer
      # releases the commit: .github/release/module-commits.cjs.
      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci
        with:
          release-tooling: true

      - name: Refuse a breaking marker on a stable release line
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.sha }}
        run: node .github/ci/check-modules.ts markers

  # Two jobs over the same files, and the halves do not overlap. actionlint
  # covers whether a workflow is correct at all — schema, expression syntax,
  # `needs:` naming a job that exists, and shellcheck over every `run:` block.
  # zizmor covers security: unpinned actions, leaked credentials, injectable
  # expressions.
  syntax:
    name: Workflow syntax
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The version tools/go.mod pins, as `task verify:workflows` runs it.
      - name: actionlint
        run: go tool -modfile=tools/go.mod actionlint

  audit:
    name: Workflow audit
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These workflows are the part of the repository that runs with a token,
      # so they are audited as code rather than trusted as config. Exceptions
      # live in .github/zizmor.yml, each with the reason it stands.
      - name: zizmor
        env:
          # Without a token zizmor runs offline and skips the audits that need
          # the API — resolving an action's ref among them.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pipx run "zizmor==${ZIZMOR_VERSION}" \
            --config .github/zizmor.yml --persona=regular --format=plain .github/workflows/ .github/actions/

  # The one check a ruleset requires. A skipped job was not reached by the
  # change, which is a pass; a failure or a cancellation anywhere is not.
  checks:
    name: All checks passed
    needs: [changes, verify, lint, pgstore, examples-pgstore, redis, floor, api, markers, syntax, audit]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci
            .github/actions

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      # See .github/ci/checks.ts.
      - name: Require every job to have passed or been skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/ci/checks.ts

  # It waits for the one required check, which stands for every job a merge
  # needs, and for released-limes, whose results release.yaml reads to decide
  # each nested module alone (.github/ci/release.ts), so a release never
  # starts before they are known.
  dispatch-release:
    name: Dispatch release
    needs: [changes, checks, released-limes]
    # Not for a documentation-only push (`code`, its diff, not what the run
    # checked): its code is byte-identical to the commit before it. Its commits are not lost — semantic-release counts them
    # in the next release, and a release dispatched by the code commit before
    # it releases past it (.github/ci/release-head.ts).
    if: >-
      always() &&
      needs.changes.outputs.code == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.checks.result == 'success' &&
      needs.released-limes.result != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # POST /repos/{owner}/{repo}/dispatches needs write
    steps:
      - name: Check out the dispatch script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci
            .github/actions

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      # Both values come from Actions itself. See .github/ci/dispatch-release.ts.
      - name: Dispatch the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/ci/dispatch-release.ts
