name: CI

# The whole pipeline: the module's gate, an audit of these workflows, and — on
# a green push to main — a dispatch to release.yaml.

on:
  push:
    branches: [main]
  pull_request:
    # edited: the title becomes the merge commit's body, which the release
    # reads, so a title changed after green is checked again.
    types: [opened, synchronize, reopened, edited]
  # A run by hand has no diff to classify, so it runs every check. It never
  # dispatches a release: that job requires a push event.
  workflow_dispatch:

# Nothing at the top level — each job asks for what it needs.
permissions: {}

# A pull request's runs share a group and the newest cancels the rest. Each
# push to main gets a group of its own: GitHub keeps one pending run per
# group and cancels it when another joins, so a shared group would drop the
# CI — and the release dispatch — of a commit merged between two others.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pinned tools, one place each. A floating tool changes what the gate checks
# with no commit of ours in between.
env:
  # The runtime of the CI scripts and the release tooling, exact so a patch
  # arrives as a reviewed change rather than whatever the runner image caches.
  # renovate: datasource=node-version depName=node
  NODE_VERSION: "24.21.0"
  # renovate: datasource=github-releases depName=go-task/task
  TASK_VERSION: "3.54.0"
  # The SHA256 of that release's task_linux_amd64.tar.gz, from its
  # task_checksums.txt: setup-task refuses an archive that does not match,
  # so a release replaced under the same tag fails the run. Renovate moves
  # TASK_VERSION alone; a bump fails here until this follows it.
  TASK_SHA256: "680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb"
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: "1.30.1"
  # The newest patch of the oldest Go the module supports: the `go` directive
  # in go.mod, which is what binds a consumer. The floor job checks they agree.
  # renovate: datasource=golang-version depName=go-floor
  GO_FLOOR_VERSION: "1.26.9"

jobs:
  # Whether anything the checks below read has changed. .github/ci/changes.ts
  # holds the list of documentation paths that change nothing.
  changes:
    name: Changed paths
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff below needs both ends of it.
          fetch-depth: 0

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Classify the diff
        id: filter
        env:
          # A pull request has both ends of its own diff; a push reports the
          # branch's previous head.
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        # Which diff, and whether it reaches code: .github/ci/changes.ts.
        run: node .github/ci/changes.ts

  # `task verify-all`, exactly as a developer runs it.
  verify:
    name: Verify
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain directive in go.mod decides the Go, so govulncheck checks
      # the standard library this module is built with.
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The cache below replaces setup-go's, which only main should write.
          cache: false

      # Keyed by what decides the cache's contents — the Go and every
      # module's go.sum, the linter's among them — not by the commit: the dependencies and the
      # standard library are most of the build, and they change with those.
      # main writes a new entry only when the key changes, and a pull request
      # restores main's, so a pull request cannot seed what main builds from.
      # A key with the commit wrote ~2 GiB on every merge and kept four.
      - name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-verify-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum', 'tools/yq/go.sum', 'tools/golangci-lint/go.sum', 'redisreplay/go.sum', 'otelmetric/go.sum', 'pgstore/go.sum', 'examples/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-verify-${{ steps.go.outputs.go-version }}-

      # A build cache entry this run uses is touched by go once it is an hour
      # old, so anything not newer than two hours before the run is one the
      # run did not use; the trim before the save drops those. Were go to
      # touch less often, the trim would drop entries it used, a slower next
      # run, never a wrong one.
      - name: Mark the run's start for the cache trim
        run: touch -d '2 hours ago' "$RUNNER_TEMP/go-cache-mark"

      # verify:ci type-checks and tests the CI scripts; verify:release-rules
      # runs the pinned commit analyzer and notes generator against
      # release.config.cjs. Node 24, as release.yaml runs it.
      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the release tooling
        working-directory: .github/release
        run: npm ci --ignore-scripts

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # --yes accepts the first-fetch trust prompt for the shared task library
      # include; unattended, that prompt is a hang rather than a question.
      - name: task verify-all
        run: task --yes verify-all

      - name: Trim the build cache to what this run used
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        run: find ~/.cache/go-build -type f ! -newer "$RUNNER_TEMP/go-cache-mark" -delete

      - name: Save the Go caches
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # pgstore's tests — storetest and metertest among them — against PostgreSQL
  # in a container, which verify-all leaves out so that it needs no Docker,
  # with the limes of this commit: limes may not break pgstore. The runner's
  # Docker serves testcontainers.
  # The pgstore example runs here too, for the same Docker.
  pgstore:
    name: PostgreSQL store
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pgstore/go.mod
          cache: false

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task test:pgstore
        run: task --yes test:pgstore

      - name: task test:examples:pgstore
        run: task --yes test:examples:pgstore

  # The same tests against the limes pgstore's go.mod requires, which is what
  # a consumer's build resolves. This gates pgstore's release, not a merge: a
  # change to limes that pgstore must follow lands with pgstore in one pull
  # request, which fails here until limes is released and Renovate raises
  # pgstore's requirement. Until then release.yaml releases limes and holds
  # pgstore back, so no pgstore is published that a consumer cannot build.
  pgstore-released-limes:
    name: PostgreSQL store, released limes
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pgstore/go.mod
          cache: false

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task test:pgstore:pinned
        run: task --yes test:pgstore:pinned

  # redisreplay's contract against a real Redis: verify-all runs it on
  # miniredis, whose scripts run on another Lua. The image is pinned by digest;
  # Renovate moves both together.
  redis:
    name: Redis replay cache
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      redis:
        image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: redisreplay/go.mod
          cache: false

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task test:redisreplay
        env:
          LIMES_REDIS_ADDR: localhost:6379
        run: task --yes test:redisreplay

  # verify-all runs on the toolchain go.mod pins. A consumer builds this module
  # with their own Go, as old as the `go` directive allows, so the suite runs
  # on that floor as well — with GOTOOLCHAIN=local, so it cannot quietly
  # switch to a newer one.
  floor:
    name: Test on the oldest supported Go
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_FLOOR_VERSION }}
          cache: false

      - name: Require GO_FLOOR_VERSION to match the go directive
        run: ./.github/scripts/go-floor-check.sh "$GO_FLOOR_VERSION" "$(go mod edit -json | jq -r .Go)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # A module of its own: ./... at the root does not reach it.
      - name: go vet redisreplay
        working-directory: redisreplay
        run: go vet ./...

      - name: go test redisreplay
        working-directory: redisreplay
        run: go test -race ./...

      - name: go vet otelmetric
        working-directory: otelmetric
        run: go vet ./...

      - name: go test otelmetric
        working-directory: otelmetric
        run: go test -race ./...

  # The release is computed from commit types, so a break of the Go API that
  # no commit marks breaking would ship as a patch or a feature. Each module
  # the repository releases is checked against the commits that touch it. apidiff
  # compares the pull request's API with its merge base; an incompatible
  # change needs a `!` or a BREAKING CHANGE: footer in one of its commits.
  # A push to main is checked again from the last release, and the release
  # waits for it: a push past the pull request rule was checked by nothing
  # else. See .github/scripts/check-range.sh.
  api:
    name: API compatibility
    needs: [changes]
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base and every commit of the pull request.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The module table the checks read is JavaScript: .github/release/modules.cjs.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # A marker counts for a module only when its own release analyzer
      # releases the commit: .github/release/module-commits.cjs.
      - name: Install the release tooling
        working-directory: .github/release
        run: npm ci --ignore-scripts

      # Every module, each from its own last release on a push: see
      # .github/scripts/check-modules.sh.
      - name: Require a break of the API to be marked breaking
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./.github/scripts/check-modules.sh api "$EVENT" "$PR_BASE" "$PR_HEAD" "$GITHUB_SHA"

  # From v1.0.0 on no commit may mark itself breaking: the release would cut
  # a major the Go proxy ignores. Git alone answers it, so it runs on every
  # pull request — a documentation-only one too, whose marker breaks the
  # release as surely as one beside code — and on every push to main, from
  # the last release, as the API check does. See
  # .github/scripts/marker-check.sh.
  markers:
    name: Breaking markers
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base, every commit of the pull request, and the tags
          # that say which release line it builds on.
          fetch-depth: 0

      # The module table the checks read is JavaScript: .github/release/modules.cjs.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # A marker counts for a module only when its own release analyzer
      # releases the commit: .github/release/module-commits.cjs.
      - name: Install the release tooling
        working-directory: .github/release
        run: npm ci --ignore-scripts

      - name: Refuse a breaking marker on a stable release line
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./.github/scripts/check-modules.sh markers "$EVENT" "$PR_BASE" "$PR_HEAD" "$GITHUB_SHA"

  # Two jobs over the same files, and the halves do not overlap. actionlint
  # covers whether a workflow is correct at all — schema, expression syntax,
  # `needs:` naming a job that exists, and shellcheck over every `run:` block.
  # zizmor covers security: unpinned actions, leaked credentials, injectable
  # expressions.
  syntax:
    name: Workflow syntax
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The version tools/go.mod pins, as `task verify:workflows` runs it.
      - name: actionlint
        run: go tool -modfile=tools/go.mod actionlint

  audit:
    name: Workflow audit
    needs: [changes]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These workflows are the part of the repository that runs with a token,
      # so they are audited as code rather than trusted as config. Exceptions
      # live in .github/zizmor.yml, each with the reason it stands.
      - name: zizmor
        env:
          # Without a token zizmor runs offline and skips the audits that need
          # the API — resolving an action's ref among them.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pipx run "zizmor==${ZIZMOR_VERSION}" \
            --config .github/zizmor.yml --persona=regular --format=plain .github/workflows/ .github/actions/

  # The one check a ruleset requires. A skipped job was not reached by the
  # change, which is a pass; a failure or a cancellation anywhere is not.
  checks:
    name: All checks passed
    needs: [changes, verify, pgstore, redis, floor, api, markers, syntax, audit]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          printf 'results: %s\n' "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                printf '%s\n' "a required job ended as ${result}"
                exit 1
                ;;
            esac
          done

  # It waits for the one required check, which stands for every job a merge
  # needs, and for pgstore-released-limes, whose result release.yaml reads to
  # decide pgstore alone (ci-job-passed.sh), so a release never starts before
  # it is known.
  dispatch-release:
    name: Dispatch release
    needs: [changes, checks, pgstore-released-limes]
    # Not for a documentation-only push: its code is byte-identical to the
    # commit before it. Its commits are not lost — semantic-release counts them
    # in the next release, and a release dispatched by the code commit before
    # it releases past it (.github/ci/release-head.ts).
    if: >-
      always() &&
      needs.changes.outputs.relevant == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.checks.result == 'success' &&
      needs.pgstore-released-limes.result != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # POST /repos/{owner}/{repo}/dispatches needs write
    steps:
      # gh-retry.sh, beside its test: one 5xx must not lose the release.
      - name: Check out the retry helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Dispatch the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/gh-retry.sh
          # --input rather than -f: client_payload is nested and the form
          # syntax cannot express that. Both values come from Actions itself
          # and arrive through env, so nothing here is substituted into the
          # script before the shell runs. A file rather than stdin, so a
          # retry sends it again.
          payload="$RUNNER_TEMP/dispatch.json"
          cat >"$payload" <<JSON
          {
            "event_type": "release",
            "client_payload": {
              "sha": "${GITHUB_SHA}",
              "ci_run_id": "${GITHUB_RUN_ID}"
            }
          }
          JSON
          gh_retry api "repos/${GITHUB_REPOSITORY}/dispatches" --input "$payload"
          printf '%s\n' "dispatched release for ${GITHUB_SHA}"
