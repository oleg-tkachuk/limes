name: Fuzz

# The unit suite replays each fuzz target's seed corpus only. This runs every
# target for real, once a week, so a parser of untrusted input is searched
# for the inputs nobody thought to write down. A failure uploads the input
# that found it; commit it under testdata/fuzz to keep it as a regression.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  # How long each target is searched.
  FUZZ_TIME: 10m

jobs:
  # The targets, read from the code, so a new one is fuzzed without an edit
  # here.
  targets:
    name: List the fuzz targets
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: List
        id: list
        run: |
          set -euo pipefail
          # -fuzz takes one package at a time, so each target travels with
          # the package it lives in.
          # A package that fails to list fails the job; one with no target
          # lists none.
          targets="$(
            for pkg in $(go list ./...); do
              listed="$(go test -list '^Fuzz' "$pkg")"
              { grep '^Fuzz' <<<"$listed" || true; } | sed "s#^#${pkg} #"
            done | jq -Rnc '[inputs | split(" ") | {package: .[0], target: .[1]}]'
          )"
          if [ "$targets" = "[]" ]; then
            echo "::error::no fuzz targets found" >&2
            exit 1
          fi
          printf 'targets=%s\n' "$targets" >>"$GITHUB_OUTPUT"
          printf '%s\n' "$targets"

  fuzz:
    name: Fuzz ${{ matrix.fuzz.target }}
    needs: [targets]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fuzz: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fuzz
        env:
          PACKAGE: ${{ matrix.fuzz.package }}
          TARGET: ${{ matrix.fuzz.target }}
        run: go test -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$FUZZ_TIME" "$PACKAGE"

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.fuzz.target }}
          path: "**/testdata/fuzz"
          if-no-files-found: ignore
