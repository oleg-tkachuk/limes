name: Fuzz

# The unit suite replays each fuzz target's seed corpus only. This runs every
# target for real, once a week, so a parser of untrusted input is searched
# for the inputs nobody thought to write down. A failure uploads the input
# that found it; commit it under testdata/fuzz to keep it as a regression.
# Each target's search, and a failure's input and how to run it again, go on
# the run's summary page (.github/ci/fuzz-summary.ts).

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  # How long each target is searched.
  FUZZ_TIME: 10m

jobs:
  # The targets, read from the code of every module the repository
  # releases (.github/ci/fuzz-targets.ts), so a new one is fuzzed without an
  # edit here.
  targets:
    name: List the fuzz targets
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      - name: List
        id: list
        run: node .github/ci/fuzz-targets.ts

  fuzz:
    name: Fuzz ${{ matrix.fuzz.target }}
    needs: [targets]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fuzz: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      # Into the log as it runs, and into a file the summary reads.
      - name: Fuzz
        id: fuzz
        working-directory: ${{ matrix.fuzz.module }}
        env:
          PACKAGE: ${{ matrix.fuzz.package }}
          TARGET: ${{ matrix.fuzz.target }}
        run: |
          set -euo pipefail
          go test -run '^$' -fuzz "^${TARGET}\$" -fuzztime "$FUZZ_TIME" "$PACKAGE" 2>&1 | tee "$RUNNER_TEMP/fuzz.log"

      - name: Summarize
        if: always() && steps.fuzz.outcome != 'skipped'
        env:
          MODULE: ${{ matrix.fuzz.module }}
          PACKAGE: ${{ matrix.fuzz.package }}
          TARGET: ${{ matrix.fuzz.target }}
          OUTCOME: ${{ steps.fuzz.outcome }}
        run: node .github/ci/fuzz-summary.ts "$RUNNER_TEMP/fuzz.log"

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.fuzz.target }}
          path: "**/testdata/fuzz"
          if-no-files-found: ignore
