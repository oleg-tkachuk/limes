name: Auto-merge

# Two automations over every pull request into main:
#
#   - merge: when ci.yaml passes for a pull request, it is merged (a merge
#     commit, as every merge into main has been) at the very commit that run
#     tested;
#   - auto-rebase: on each push to main, every open pull request that has
#     fallen behind is rebased onto the new head, so it is tested against
#     what it would actually merge into.
#
# Both act through AUTOMERGE_TOKEN — a fine-grained token or GitHub App token
# with Contents and Pull requests write on this repository — and never through
# GITHUB_TOKEN. That is not a style choice. A push or merge made with
# GITHUB_TOKEN starts no workflow: a rebased branch would get no CI and wait
# forever on its required check, and a merge would land on main with no CI
# run, so ci.yaml would never dispatch the release. Without the secret both
# jobs warn and do nothing.
#
# The merge is decided when the run that tested the pull request completes,
# not armed ahead of it: workflow_run runs main's copy of this workflow and of
# .github/scripts/merge-green.sh, which reads the pull request then and merges
# it with --match-head-commit at the tested commit. A push since moves the
# head, the merge is refused, and the new head's own run decides. So no
# earlier verdict can merge a later push, and a pull request cannot rewrite
# the rule that holds it; nothing of it is checked out or run, only its
# metadata and the names of its files read. Left for a person
# (.github/scripts/merge-policy.sh): a draft — mark one draft to hold it —, a
# fork's, Renovate's (Renovate merges its own once a release is old enough,
# renovate.json), one into another branch, one whose author cannot push here,
# and one that changes what CI runs, whose green check is no evidence.
#
# Repository settings this relies on (Settings → General → Pull Requests):
# "Allow merge commits" on, and branch protection or a ruleset on main
# requiring the "All checks passed" check, so nothing else merges a pull
# request ahead of it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]

# Nothing at the top level; the token that acts is AUTOMERGE_TOKEN.
permissions: {}

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge a green pull request
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # the checkout below; the merge itself acts through AUTOMERGE_TOKEN
    steps:
      # main's script: workflow_run runs the default branch's workflow, and
      # its checkout is the default branch's, never the pull request's.
      - name: Check out the merge script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Merge the pull request at the commit its run tested
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        # .github/scripts/merge-green.sh
        run: ./.github/scripts/merge-green.sh

  rebase:
    name: Rebase open pull requests onto main
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout below; the rebase itself acts through AUTOMERGE_TOKEN
    steps:
      # The script lives in the repository, beside its test.
      - name: Check out the rebase script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Rebase every pull request that is behind main
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
        # .github/scripts/rebase-behind.sh
        run: ./.github/scripts/rebase-behind.sh
