name: Auto-merge

# Two automations over every pull request into main:
#
#   - auto-merge: each pull request is queued to merge (a merge commit, as
#     every merge into main has been) the moment its required checks and
#     reviews pass;
#   - auto-rebase: on each push to main, every open pull request that has
#     fallen behind is rebased onto the new head, so it is tested against
#     what it would actually merge into.
#
# Both act through AUTOMERGE_TOKEN — a fine-grained token or GitHub App token
# with Contents and Pull requests write on this repository — and never through
# GITHUB_TOKEN. That is not a style choice. A push or merge made with
# GITHUB_TOKEN starts no workflow: a rebased branch would get no CI and wait
# forever on its required check, and a merge would land on main with no CI
# run, so ci.yaml would never dispatch the release. Without the secret both
# jobs warn and do nothing.
#
# Same-repository pull requests only. A fork's branch belongs to its author:
# rewriting it is not ours to do, and merging it stays a person's decision.
# A draft is left alone until it is marked ready. Auto-merge is queued once,
# when a pull request opens or becomes ready, not on every push: a push —
# the rebase below among them — would otherwise queue again a pull request a
# maintainer took off the queue to hold it. Renovate's are left to
# Renovate, which merges them itself only once a release is old enough
# (renovate.json, minimumReleaseAge) and rebases its own branches: queueing
# them here merged them while that check was still pending.
#
# Repository settings this relies on (Settings → General → Pull Requests):
# "Allow auto-merge" and "Allow merge commits" on, and branch protection or a
# ruleset on main requiring the "All checks passed" check — without a
# required check, auto-merge would merge immediately.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  push:
    branches: [main]

# Nothing at the top level; the token that acts is AUTOMERGE_TOKEN.
permissions: {}

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  enable:
    name: Enable auto-merge
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Queue the pull request to merge when it is green
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::AUTOMERGE_TOKEN is not set; auto-merge left off (see auto-merge.yaml)"
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --merge

  rebase:
    name: Rebase open pull requests onto main
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # the checkout below; the rebase itself acts through AUTOMERGE_TOKEN
    steps:
      # The script lives in the repository, beside its test.
      - name: Check out the rebase script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Rebase every pull request that is behind main
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
        # .github/scripts/rebase-behind.sh
        run: ./.github/scripts/rebase-behind.sh
