name: Auto-merge

# When ci.yaml passes for a pull request into main, the pull request is merged
# (a merge commit, as every merge into main has been) at the very commit that
# run tested. main does not require a pull request to be up to date with it,
# so a green one merges at once and no merge makes another wait for a rebase
# and a second run; a change that only breaks beside another is caught by the
# CI run of main itself after the merge.
#
# The merge acts through AUTOMERGE_TOKEN — a fine-grained token or GitHub App
# token with Contents and Pull requests write on this repository — and never
# through GITHUB_TOKEN. That is not a style choice: a merge made with
# GITHUB_TOKEN starts no workflow, so it would land on main with no CI run,
# and ci.yaml would never dispatch the release. Without the secret it warns
# and does nothing.
#
# The token is a secret of the automerge environment, not of the repository,
# and that environment admits main alone (Settings → Environments →
# automerge → Deployment branches: main). A workflow a collaborator pushes on
# any other branch therefore cannot read it: only the reviewed copy of this
# job, and of release.yaml's, on main can.
#
# The merge is decided when the run that tested the pull request completes,
# not armed ahead of it: workflow_run runs main's copy of this workflow and of
# .github/ci/merge-green.ts, which reads the pull request then and merges it
# only at the tested commit. A push since moves the
# head, the merge is refused, and the new head's own run decides. So no
# earlier verdict can merge a later push, and a pull request cannot rewrite
# the rule that holds it; nothing of it is checked out or run, only its
# metadata and the names of its files read. Left for a person
# (.github/ci/merge-policy.ts): a draft — mark one draft to hold it —, a
# fork's, Renovate's (Renovate merges its own once a release is old enough,
# renovate.json), one into another branch, one whose author cannot push here,
# and one that changes what CI runs, whose green check is no evidence.
#
# Repository settings this relies on (Settings → General → Pull Requests):
# "Allow merge commits" on, and a ruleset on main requiring the "All checks
# passed" check, so nothing else merges a pull request ahead of it, without
# requiring branches to be up to date.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Nothing at the top level; the token that acts is AUTOMERGE_TOKEN.
permissions: {}

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge a green pull request
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # AUTOMERGE_TOKEN lives in this environment, which only main may deploy to.
    environment: automerge
    permissions:
      contents: read # the checkout below; the merge itself acts through AUTOMERGE_TOKEN
    steps:
      # main's scripts: workflow_run runs the default branch's workflow, and
      # its checkout is the default branch's, never the pull request's.
      - name: Check out the merge script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci
            .github/actions

      # Before the token reaches any step: no package's install script runs.
      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      - name: Merge the pull request at the commit its run tested
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: node .github/ci/merge-green.ts
