name: Set up the CI scripts
description: >-
  Node at the version .github/ci/.node-version pins, and the CI scripts'
  dependencies from their lockfile with no install script run, so a step can
  run `node .github/ci/<command>.ts`.

inputs:
  release-tooling:
    description: Also install the release tooling in .github/release (semantic-release and its preset).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # One pin for every workflow, exact so a patch arrives as a reviewed
    # change rather than whatever the runner image caches. No dependency
    # cache: a job here may hold a write token, and a cache another run wrote
    # is not something to restore into it.
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .github/ci/.node-version
        package-manager-cache: false

    # Bounded in time and tried again: npm once hung on the registry for a
    # whole job. See .github/ci/install.ts.
    - name: Install the CI scripts' dependencies
      shell: bash
      run: node .github/ci/install.ts .github/ci

    - name: Install the release tooling
      if: inputs.release-tooling == 'true'
      shell: bash
      run: node .github/ci/install.ts .github/release
