# zizmor configuration.
#
# Each relaxed audit is relaxed for one file, with the reason stated. Everything else
# runs: actions are pinned to commit SHAs, no workflow input reaches a shell,
# and every job asks for the narrowest token it needs.
rules:
  artipacked:
    ignore:
      # release.yaml is the one checkout in this repository that genuinely
      # needs its credentials: semantic-release pushes the tag it creates.
      # Every other checkout sets persist-credentials: false, which is what
      # this audit asks for.
      - release.yaml
  dangerous-triggers:
    ignore:
      # auto-merge.yaml decides whether a pull request may merge on its own,
      # so that decision must not be the pull request's to rewrite: it runs
      # under workflow_run, from main's copy. It checks out main's scripts
      # only, never the pull request's head, runs no code of it, and reads
      # nothing of it but its metadata and the names of the files it changes;
      # a fork's run is filtered out before any step.
      - auto-merge.yaml
