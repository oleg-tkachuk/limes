# Shapes the notes GitHub generates for a release — release.yaml calls
# `gh release create --generate-notes`, and this decides what they contain.
# They go below the notes semantic-release generates from the commits, which
# sort the changes into breaking changes, features and fixes; this part is
# the plain list of merged pull requests, so it has no categories of its own.
changelog:
  exclude:
    authors:
      - renovate[bot]
      - dependabot[bot]
      - github-actions[bot]
