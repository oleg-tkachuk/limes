# Task's own settings, read by every `task` run from this checkout.
remote:
  # The shared task library (TASKLIB in Taskfile.yaml) is loaded from the
  # lock committed under .task/remote and never fetched. Only `task --yes
  # --offline=false --download tasklib:lock`, and tasklib:bump through it,
  # go to the network.
  offline: true
  # The time that fetch may take. Task's default, 10s, is below what a clone
  # sometimes takes, and a clone it cuts short fails the refresh.
  timeout: 2m
